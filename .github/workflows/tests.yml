name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, zlib
          coverage: none
      # Test the package users actually upload, not just the source folder.
      - run: make build
      - run: WPB_E2E_ZIP="$PWD/builds/wp-bouncer-$(make -s version).zip" tests/e2e/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wp-bouncer-zip
          path: builds/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: cs2pr
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpcs -q --report=checkstyle | cs2pr
        continue-on-error: true
